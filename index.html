<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale walk — practice</title>
<meta name="theme-color" content="#1d1613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scale Trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preload" href="fonts/young-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<!-- Theme before the first paint (SPEC §18): the saved choice -->
<script>
  try {
    var t = JSON.parse(localStorage.getItem("scaleWalkLight") || "{}").theme;
    t = { light: "maple", material: "steel" }[t] || t;   // earlier names
    document.documentElement.dataset.theme = t === "maple" || t === "steel" ? t : "sepia";
  } catch (e) {}
</script>
</head>
<body>
<div class="corner left">
  <button id="keyBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="keyPanel"></button>
  <button id="showAll" class="eye" data-level="1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g class="eye-1"><path d="M2 12Q12 1 22 12Q12 23 2 12z"/><circle cx="12" cy="12" r="3"/></g>
      <g class="eye-2"><path d="M2 12Q12 8 22 12M2 12Q12 23 22 12"/><path d="M9.76 10A3 3 0 1 0 14.24 10"/></g>
      <g class="eye-3"><path d="M2 12Q12 13 22 12M2 12Q12 22 22 12"/><path d="M9.04 12.5A3 3 0 0 0 14.96 12.5"/></g>
      <g class="eye-4"><path d="M2 10.5c2.6 3.6 6 5.5 10 5.5s7.4-1.9 10-5.5"/><path d="M5.6 14l-1.5 2.2M12 16v2.6M18.4 14l1.5 2.2"/></g>
    </svg>
  </button>
  <button id="boardBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="boardPanel" data-i18n-aria="board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.4 11.6 19.6 4.4M18.2 3l2.8 2.8"/>
      <path d="M11.3 9.4c-1.3-.9-3.1-.8-4.2.3-.7.7-1 1.7-.9 2.6-1.1.1-2.1.6-2.8 1.5-1.4 1.8-1 4.6 1 6.1 2 1.6 4.8 1.6 6.3-.2.7-.8 1-1.8 1-2.8.9 0 1.8-.4 2.4-1.1 1.1-1.1 1.2-2.9.3-4.2"/>
      <circle cx="10" cy="14" r="1.4"/>
      <path d="M6.6 16.6l1.8 1.8"/>
    </svg>
  </button>
</div>
<div id="boardPanel" role="dialog" data-i18n-aria="board" hidden>
  <div class="bp-head">
    <span data-i18n="board"></span>
    <button id="boardSwitch" role="switch" aria-checked="false" data-i18n-aria="board"></button>
  </div>
  <div class="bp-title" data-i18n="boardZone"></div>
  <div class="bp-frets">
    <div class="field"><label for="fretFrom" data-i18n="fretFrom"></label><select id="fretFrom"></select></div>
    <div class="field"><label for="fretTo" data-i18n="fretTo"></label><select id="fretTo"></select></div>
  </div>
  <p class="bp-hint" data-i18n="boardHint"></p>
  <button id="boardDone" data-i18n="boardDone"></button>
</div>
<div id="keyPanel" role="dialog" data-i18n-aria="keysTitle" hidden>
  <div class="kp-exercise" role="group" data-i18n-aria="exercise">
    <button data-ex="chords" data-i18n="exChords"></button>
    <button data-ex="walk" data-i18n="exWalk"></button>
    <button data-ex="penta" data-i18n="exPenta"></button>
  </div>
  <div id="walkSetup">
    <div class="kp-head"><span data-i18n="keysTitle"></span><span id="keyCount"></span></div>
    <div id="keyGrid"></div>
    <div class="kp-actions">
      <button id="keysAll" data-i18n="keysAll"></button>
      <button id="keysClear" data-i18n="keysClear"></button>
    </div>
    <fieldset class="kp-order">
      <legend data-i18n="order"></legend>
      <label><input type="radio" name="order" value="random"><span data-i18n="orderRandom"></span></label>
      <label><input type="radio" name="order" value="sequential"><span data-i18n="orderSequential"></span></label>
    </fieldset>
  </div>
  <div id="chordSetup" hidden>
    <div class="kp-chords">
      <div class="field"><label for="chordA" data-i18n="chordA"></label><select id="chordA"></select></div>
      <div class="field"><label for="chordB" data-i18n="chordB"></label><select id="chordB"></select></div>
    </div>
    <div class="kp-place">
      <span id="beatsLabel" data-i18n="chordBeats"></span>
      <div id="beatsGrid" class="kp-choice" role="group" aria-labelledby="beatsLabel">
        <button data-beats="2">2</button><button data-beats="4">4</button><button data-beats="8">8</button>
      </div>
    </div>
  </div>
  <div id="pentaSetup" hidden>
    <div class="kp-head"><span data-i18n="minorKey"></span><span id="shapeKey"></span></div>
    <div id="pentaKeyGrid"></div>
    <div class="kp-head kp-shapes"><span data-i18n="shape"></span></div>
    <div id="shapeGrid"></div>
    <div id="placeRow" class="kp-place" hidden>
      <span data-i18n="variant"></span>
      <div id="placeGrid" role="group" data-i18n-aria="variant"></div>
    </div>
    <p id="openHint" class="kp-hint" data-i18n="openHint" hidden></p>
    <div class="kp-switch">
      <span id="neckLabel" data-i18n="neckWalk"></span>
      <button id="neckSwitch" class="switch" role="switch" aria-checked="false" aria-labelledby="neckLabel"></button>
    </div>
  </div>
</div>
<div class="corner right">
  <button id="tunerBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="tunerPanel" data-i18n-aria="tuner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8.5 2.5v7.5a3.5 3.5 0 0 0 7 0V2.5M12 13.5v8"/>
    </svg>
  </button>
  <button id="menuBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="menuPanel" data-i18n-aria="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>
</div>
<div id="menuPanel" role="dialog" data-i18n-aria="menu" hidden>
  <div id="menuMain">
    <div class="bp-title mp-first" data-i18n="lang"></div>
    <div id="langRow" class="mp-row" role="group" data-i18n-aria="lang"></div>
    <div class="bp-title" data-i18n="theme"></div>
    <div id="themeRow" class="mp-row" role="group" data-i18n-aria="theme">
      <button data-theme="sepia" data-i18n="themeSepia"></button>
      <button data-theme="maple" data-i18n="themeMaple"></button>
      <button data-theme="steel" data-i18n="themeSteel"></button>
    </div>
    <div class="mp-links">
      <button id="helpBtn" data-i18n="help"></button>
      <button id="aboutBtn" data-i18n="about"></button>
    </div>
  </div>
  <div id="aboutView" hidden>
    <button id="aboutBack" class="mp-back" data-i18n="back"></button>
    <p data-i18n="aboutText1"></p>
    <p data-i18n="aboutText2"></p>
    <p data-i18n="aboutText3"></p>
    <p data-i18n="aboutText4"></p>
    <a class="mp-coffee" href="https://buymeacoffee.com/misan128" target="_blank" rel="noopener" data-i18n="aboutCoffee"></a>
    <a class="mp-code" href="https://github.com/misan128/scale-trainer" target="_blank" rel="noopener" data-i18n="aboutCode"></a>
  </div>
</div>
<div id="tunerPanel" role="dialog" data-i18n-aria="tuner" hidden>
  <div class="bp-head"><span data-i18n="tuner"></span><span id="tunerState" class="tn-state" aria-live="polite"></span></div>
  <div id="tunerRead" class="tn-read" role="img">
    <div class="tn-note"><span id="tunerNote">–</span><span id="tunerOct" class="tn-oct"></span></div>
    <div class="tn-meter" aria-hidden="true">
      <span>♭</span>
      <div class="tn-scale"><i class="tn-zone"></i><i class="tn-center"></i><i id="tunerNeedle" class="tn-needle"></i></div>
      <span>♯</span>
    </div>
    <div id="tunerCents" class="tn-cents" aria-hidden="true"></div>
  </div>
  <div class="tn-level" aria-hidden="true"><i id="tunerLevel"></i></div>
  <div class="bp-title" data-i18n="tuning"></div>
  <div id="tuningRow" class="tn-tunings" role="group" data-i18n-aria="tuning"></div>
  <div class="bp-title" data-i18n="tunerRef"></div>
  <div id="tunerRef" class="tn-ref"></div>
  <button id="tunerDone" data-i18n="boardDone"></button>
</div>
<div id="guide" role="dialog" aria-modal="true" aria-labelledby="guideTitle" aria-describedby="guideText" hidden>
  <div id="guideSpot"></div>
  <div id="guideTip">
    <p id="guideTitle"></p>
    <p id="guideText"></p>
    <ul id="guideLegend" class="g-legend" hidden></ul>
    <div id="guideLangs" class="g-langs" hidden></div>
    <div class="g-foot">
      <span id="guideDots"></span>
      <button id="guideSkip" data-i18n="guideSkip"></button>
      <button id="guideNext"></button>
    </div>
  </div>
</div>
<main>
  <section class="stage">
    <div class="display">
      <div id="roundKey" hidden></div>
      <svg id="pick" viewBox="0 0 100 112" data-i18n-aria="pickAria" role="img">
        <path d="M50 108 C34 96 6 60 7 32 C8 11 28 4 50 4 C72 4 92 11 93 32 C94 60 66 96 50 108 Z" class="pk-body"/>
        <path class="pk-shine" d="M24 26 C30 16 40 13 50 13" fill="none" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
        <circle class="pk-dot" cx="50" cy="44" r="9" fill-opacity=".18"/>
      </svg>
      <div id="note" hidden></div>
    </div>
    <div id="phase"></div>
    <svg id="board" role="img" hidden></svg>
    <div id="chordView" class="ch-view" hidden>
      <div class="ch-card ch-now">
        <div class="ch-label" data-i18n="chordNow"></div>
        <div class="ch-name"></div>
        <svg class="ch-diagram" aria-hidden="true"></svg>
        <div id="chordBeatsShown" class="ch-beats" aria-hidden="true"></div>
      </div>
      <div class="ch-card ch-next">
        <div class="ch-label" data-i18n="chordNext"></div>
        <div class="ch-name"></div>
        <svg class="ch-diagram" aria-hidden="true"></svg>
      </div>
    </div>
  </section>

  <div id="track" aria-hidden="true"></div>

  <section class="controls">
    <div class="field bpm">
      <label for="bpm" data-i18n="bpm"></label>
      <div class="stepper">
        <button data-target="bpm" data-delta="-1" data-i18n-aria="bpmDown">−</button>
        <input id="bpm" type="number" inputmode="numeric" min="30" max="300" value="60">
        <button data-target="bpm" data-delta="1" data-i18n-aria="bpmUp">+</button>
      </div>
    </div>
    <div class="field">
      <label for="prep" data-i18n="prep"></label>
      <div class="stepper">
        <button data-target="prep" data-delta="-1" data-i18n-aria="prepLess">−</button>
        <input id="prep" type="number" inputmode="numeric" min="1" max="16" value="4">
        <button data-target="prep" data-delta="1" data-i18n-aria="prepMore">+</button>
      </div>
    </div>
    <div class="field">
      <label for="wait" data-i18n="wait"></label>
      <div class="stepper">
        <button data-target="wait" data-delta="-1" data-i18n-aria="waitLess">−</button>
        <input id="wait" type="number" inputmode="numeric" min="0" max="16" value="4">
        <button data-target="wait" data-delta="1" data-i18n-aria="waitMore">+</button>
      </div>
    </div>
    <input id="bpmRange" type="range" min="30" max="300" value="60" data-i18n-aria="bpm">
    <p class="hint" data-i18n="hint"></p>
  </section>

  <div class="actions">
    <button id="toggle"></button>
  </div>
</main>

<script src="js/strings.js"></script>
<script src="js/theory.js"></script>
<script src="js/pitch.js"></script>
<script type="module" src="js/app/main.js"></script>
</body>
</html>
