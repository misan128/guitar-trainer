<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido de escala — práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #1d1613;
    --wood-2: #2a201b;
    --bone: #ede3d1;
    --muted: #8c7b6c;
    --brass: #d1a65a;
    --wire: #5a4c42;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--wood);
    color: var(--bone);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr auto auto;
    gap: 2rem;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 2rem;
  }

  /* Escenario: púa en reposo, nota en marcha */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 40vh;
  }
  .display {
    height: clamp(9rem, 38vw, 17rem);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #note {
    font-family: "Young Serif", Georgia, serif;
    font-size: clamp(9rem, 38vw, 17rem);
    line-height: 1;
    white-space: nowrap;
    color: var(--brass);
  }
  #pick {
    height: 72%;
    width: auto;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(-8deg) scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) { #pick { animation: none; transform: rotate(-8deg); } }
  [hidden] { display: none !important; }
  #phase {
    margin-top: .75rem;
    color: var(--muted);
    font-size: 1.05rem;
    min-height: 1.5em;
  }

  /* Ticks de la ronda */
  #track {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 64px;
    overflow-x: auto;
  }
  #track span {
    flex: 1 1 0;
    min-width: 6px;
    background: var(--wire);
    border-radius: 2px;
  }
  #track span.walk { background: #7d6655; }
  #track span.on { background: var(--brass); }

  /* Controles */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem 1.25rem;
    align-items: end;
  }
  .field label, .field .lbl {
    display: block;
    color: var(--muted);
    font-size: .9rem;
    margin-bottom: .4rem;
  }
  .stepper, select {
    display: flex;
    align-items: center;
    background: var(--wood-2);
    border-radius: 10px;
    height: 2.8rem;
  }
  .stepper button {
    background: none;
    border: 0;
    color: var(--bone);
    font-size: 1.3rem;
    width: 2.6rem;
    height: 100%;
    cursor: pointer;
    border-radius: 10px;
  }
  .stepper input {
    width: 100%;
    min-width: 0;
    background: none;
    border: 0;
    color: var(--bone);
    font: 600 1.35rem "Instrument Sans", system-ui, sans-serif;
    text-align: center;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-inner-spin-button,
  .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  select {
    width: 100%;
    border: 0;
    color: var(--bone);
    font: 600 1.2rem "Instrument Sans", system-ui, sans-serif;
    padding: 0 .9rem;
    cursor: pointer;
  }
  select:disabled { opacity: .5; cursor: not-allowed; }
  .check {
    grid-column: span 2;
    display: flex;
    align-items: center;
    gap: .7rem;
    height: 2.8rem;
    cursor: pointer;
    font-size: 1.05rem;
  }
  .check input { width: 1.3rem; height: 1.3rem; accent-color: var(--brass); margin: 0; }
  #bpmRange {
    grid-column: 1 / -1;
    width: 100%;
    accent-color: var(--brass);
  }
  #toggle {
    grid-column: 1 / -1;
    height: 3.4rem;
    border: 0;
    border-radius: 12px;
    background: var(--brass);
    color: var(--wood);
    font: 600 1.15rem "Instrument Sans", system-ui, sans-serif;
    cursor: pointer;
  }
  #toggle.running { background: var(--bone); }
  .hint { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }

  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
  @media (max-width: 480px) {
    .controls { grid-template-columns: 1fr; }
    .check { grid-column: auto; }
  }
</style>
</head>
<body>
<main>
  <section class="stage" aria-live="polite">
    <div class="display">
      <svg id="pick" viewBox="0 0 100 112" aria-label="En reposo" role="img">
        <path d="M50 108 C34 96 6 60 7 32 C8 11 28 4 50 4 C72 4 92 11 93 32 C94 60 66 96 50 108 Z" fill="#d1a65a"/>
        <path d="M24 26 C30 16 40 13 50 13" fill="none" stroke="#ede3d1" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
        <circle cx="50" cy="44" r="9" fill="#1d1613" fill-opacity=".18"/>
      </svg>
      <div id="note" hidden></div>
    </div>
    <div id="phase">Elige tonalidad y pulsa Empezar</div>
  </section>

  <div id="track" aria-hidden="true"></div>

  <section class="controls">
    <div class="field">
      <label for="bpm">BPM</label>
      <div class="stepper">
        <button data-target="bpm" data-delta="-1" aria-label="Bajar BPM">−</button>
        <input id="bpm" type="number" min="30" max="300" value="60">
        <button data-target="bpm" data-delta="1" aria-label="Subir BPM">+</button>
      </div>
    </div>
    <div class="field">
      <label for="prep">Ticks antes del recorrido</label>
      <div class="stepper">
        <button data-target="prep" data-delta="-1" aria-label="Menos ticks de preparación">−</button>
        <input id="prep" type="number" min="1" max="16" value="4">
        <button data-target="prep" data-delta="1" aria-label="Más ticks de preparación">+</button>
      </div>
    </div>
    <div class="field">
      <label for="wait">Ticks después del recorrido</label>
      <div class="stepper">
        <button data-target="wait" data-delta="-1" aria-label="Menos ticks de espera">−</button>
        <input id="wait" type="number" min="0" max="16" value="4">
        <button data-target="wait" data-delta="1" aria-label="Más ticks de espera">+</button>
      </div>
    </div>
    <div class="field">
      <label for="key">Tonalidad (mayor)</label>
      <select id="key"></select>
    </div>
    <label class="check">
      <input id="showAll" type="checkbox">
      Mostrar todas las notas del recorrido
    </label>
    <input id="bpmRange" type="range" min="30" max="300" value="60" aria-label="BPM">
    <button id="toggle">Empezar</button>
    <p class="hint">Espacio para empezar o parar · ↑ ↓ cambian el BPM · La tonalidad se cambia con la práctica parada</p>
  </section>
</main>

<script>
(() => {
  const WALK = 15;                 // 8 subiendo + 7 bajando
  const LOOKAHEAD_MS = 25;
  const SCHEDULE_AHEAD = 0.1;
  const BASE_MIDI = 48;            // nota de inicio siempre en octava 3 (C3–B3)

  // ---- Teoría: escala mayor con la grafía de su armadura ----
  const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
  const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];
  const KEYS = [
    { name: "C", pc: 0, letter: 0 },  { name: "D♭", pc: 1, letter: 1 },
    { name: "D", pc: 2, letter: 1 },  { name: "E♭", pc: 3, letter: 2 },
    { name: "E", pc: 4, letter: 2 },  { name: "F", pc: 5, letter: 3 },
    { name: "F♯", pc: 6, letter: 3 }, { name: "G", pc: 7, letter: 4 },
    { name: "A♭", pc: 8, letter: 5 }, { name: "A", pc: 9, letter: 5 },
    { name: "B♭", pc: 10, letter: 6 },{ name: "B", pc: 11, letter: 6 },
  ];
  function scaleNames(key) {
    return MAJOR.map((iv, d) => {
      const l = (key.letter + d) % 7;
      const pc = (key.pc + iv) % 12;
      const diff = ((pc - LETTER_PC[l] + 18) % 12) - 6;   // −1, 0, +1
      return LETTERS[l] + (diff > 0 ? "♯" : diff < 0 ? "♭" : "");
    });
  }
  const semis = d => MAJOR[d % 7] + 12 * Math.floor(d / 7);

  const $ = id => document.getElementById(id);
  const noteEl = $("note"), pickEl = $("pick"), phaseEl = $("phase"), trackEl = $("track");
  const inputs = { bpm: $("bpm"), prep: $("prep"), wait: $("wait") };
  const keyEl = $("key"), showAllEl = $("showAll");
  const bpmRange = $("bpmRange"), toggleBtn = $("toggle");

  // Orden del selector: círculo de quintas (C G D A E B F♯ D♭ A♭ E♭ B♭ F)
  for (let i = 0, pc = 0; i < 12; i++, pc = (pc + 7) % 12) {
    const idx = KEYS.findIndex(k => k.pc === pc);
    keyEl.add(new Option(KEYS[idx].name, idx));
  }

  // ---- Ajustes ----
  function clampInput(el) {
    const v = Math.round(Number(el.value));
    const min = Number(el.min), max = Number(el.max);
    el.value = Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : min;
    return Number(el.value);
  }
  function save() {
    try {
      localStorage.setItem("scaleWalkLight", JSON.stringify({
        bpm: inputs.bpm.value, prep: inputs.prep.value, wait: inputs.wait.value,
        key: keyEl.value, showAll: showAllEl.checked
      }));
    } catch (e) {}
  }
  try {
    const s = JSON.parse(localStorage.getItem("scaleWalkLight") || "null");
    if (s) {
      for (const k of ["bpm", "prep", "wait"]) if (s[k] != null) inputs[k].value = s[k];
      if (s.key != null && KEYS[s.key]) keyEl.value = s.key;
      showAllEl.checked = !!s.showAll;
    }
  } catch (e) {}
  for (const k in inputs) clampInput(inputs[k]);
  bpmRange.value = inputs.bpm.value;

  function setBpm(v) {
    inputs.bpm.value = v;
    bpmRange.value = clampInput(inputs.bpm);
    save();
  }
  document.querySelectorAll(".stepper button").forEach(b => {
    b.addEventListener("click", () => {
      const el = inputs[b.dataset.target];
      el.value = Number(el.value) + Number(b.dataset.delta);
      clampInput(el);
      if (el === inputs.bpm) bpmRange.value = el.value;
      save();
      if (!running) drawTrack(-1);
    });
  });
  for (const k in inputs) inputs[k].addEventListener("change", () => {
    clampInput(inputs[k]);
    if (k === "bpm") bpmRange.value = inputs.bpm.value;
    save();
    if (!running) drawTrack(-1);
  });
  bpmRange.addEventListener("input", () => setBpm(bpmRange.value));
  keyEl.addEventListener("change", save);
  showAllEl.addEventListener("change", save);

  // ---- Audio ----
  let ctx = null;
  function click(time, accent, soft) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = accent ? 1600 : 1000;
    const peak = soft ? (accent ? 0.3 : 0.18) : (accent ? 0.9 : 0.6);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(peak, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    osc.connect(gain).connect(ctx.destination);
    osc.start(time);
    osc.stop(time + 0.05);
  }

  // Cuerda pulsada (Karplus-Strong) con retardo fraccional para afinar exacto.
  const pluckCache = new Map();
  function pluckBuffer(midi) {
    if (pluckCache.has(midi)) return pluckCache.get(midi);
    const sr = ctx.sampleRate;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const len = Math.floor(sr * 1.6);
    const y = new Float32Array(len);
    const P = sr / freq - 0.5;          // el promediado añade medio sample de retardo
    const i0 = Math.floor(P), fr = P - i0;
    const seed = i0 + 2;
    let prev = 0;
    for (let n = 0; n < seed; n++) {    // ráfaga de ruido suavizada
      prev = 0.6 * (Math.random() * 2 - 1) + 0.4 * prev;
      y[n] = prev;
    }
    const decay = 0.996;
    const at = n => (1 - fr) * y[n - i0] + fr * y[n - i0 - 1];
    for (let n = seed; n < len; n++) y[n] = decay * 0.5 * (at(n) + at(n - 1));
    const fade = Math.floor(sr * 0.05);
    for (let n = 0; n < fade; n++) y[len - 1 - n] *= n / fade;
    const buf = ctx.createBuffer(1, len, sr);
    buf.copyToChannel(y, 0);
    pluckCache.set(midi, buf);
    return buf;
  }
  function playNote(midi, time, duration) {
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    src.buffer = pluckBuffer(midi);
    gain.gain.setValueAtTime(0.7, time);
    if (duration) {                      // apagar al llegar la siguiente nota
      gain.gain.setValueAtTime(0.7, time + duration * 0.92);
      gain.gain.linearRampToValueAtTime(0.0001, time + duration);
    }
    src.connect(gain).connect(ctx.destination);
    src.start(time);
    src.stop(time + (duration || src.buffer.duration));
  }

  // ---- Planificador con lookahead ----
  let running = false, timerId = null;
  let nextTime = 0, step = 0;
  let round = null;
  let session = null;                  // tonalidad fija durante la sesión
  let lastDeg = null;
  const queue = [];

  function newRound() {
    let deg;
    do { deg = Math.floor(Math.random() * 7); } while (deg === lastDeg);
    lastDeg = deg;
    const start = BASE_MIDI + (session.key.pc + MAJOR[deg]) % 12;
    const up = Array.from({ length: 8 }, (_, k) => ({
      midi: start + semis(deg + k) - semis(deg),
      name: session.names[(deg + k) % 7],
    }));
    const walk = up.concat(up.slice(0, 7).reverse());
    const prep = Number(inputs.prep.value), wait = Number(inputs.wait.value);
    return { walk, prep, wait, total: prep + WALK + wait };
  }

  function scheduler() {
    while (nextTime < ctx.currentTime + SCHEDULE_AHEAD) {
      const beat = 60 / Number(inputs.bpm.value);
      if (step === 0) {
        round = newRound();
        playNote(round.walk[0].midi, nextTime);   // referencia al anunciar
      }
      const w = step - round.prep;
      if (w >= 0 && w < WALK) {
        click(nextTime, w === 0, true);          // click leve
        playNote(round.walk[w].midi, nextTime, beat);
      } else {
        click(nextTime, false, false);
      }
      queue.push({ time: nextTime, step, round });
      nextTime += beat;
      step = (step + 1) % round.total;
    }
    timerId = setTimeout(scheduler, LOOKAHEAD_MS);
  }

  // ---- Pintado sincronizado con lo audible ----
  let shownRound = null;
  function draw() {
    if (!running) return;
    const now = ctx.currentTime - (ctx.outputLatency || 0);
    let current = null;
    while (queue.length && queue[0].time <= now) current = queue.shift();
    if (current) render(current);
    requestAnimationFrame(draw);
  }

  function render({ step, round }) {
    if (round !== shownRound) {
      shownRound = round;
      buildTrack(round.prep, round.wait);
      pickEl.setAttribute("hidden", "");
      noteEl.hidden = false;
    }
    const w = step - round.prep;
    const inWalk = w >= 0 && w < WALK;
    noteEl.textContent = (inWalk && showAllEl.checked ? round.walk[w] : round.walk[0]).name;

    const k = session.key.name + " mayor";
    if (step < round.prep) phaseEl.textContent = `${k} · Prepárate · ${round.prep - step}`;
    else if (inWalk) phaseEl.textContent = `${k} · ${w < 8 ? "Subiendo" : "Bajando"}`;
    else phaseEl.textContent = `${k} · Siguiente nota en ${round.total - step}`;
    drawTrack(step);
  }

  // Barras: planas en preparación y espera; suben y bajan en el recorrido
  function buildTrack(prep, wait) {
    trackEl.innerHTML = "";
    const add = (h, walk) => {
      const s = document.createElement("span");
      s.style.height = h + "%";
      if (walk) s.className = "walk";
      trackEl.appendChild(s);
    };
    for (let i = 0; i < prep; i++) add(14, false);
    for (let i = 0; i < WALK; i++) add(24 + (i < 8 ? i : 14 - i) * 10.8, true);
    for (let i = 0; i < wait; i++) add(14, false);
  }
  function drawTrack(step) {
    if (step < 0) buildTrack(Number(inputs.prep.value), Number(inputs.wait.value));
    [...trackEl.children].forEach((s, i) => s.classList.toggle("on", i === step));
  }

  // ---- Start / stop ----
  function start() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    for (const k in inputs) clampInput(inputs[k]);
    const key = KEYS[keyEl.value];
    session = { key, names: scaleNames(key) };
    keyEl.disabled = true;
    running = true;
    step = 0;
    lastDeg = null;
    queue.length = 0;
    shownRound = null;
    nextTime = ctx.currentTime + 0.1;
    scheduler();
    requestAnimationFrame(draw);
    toggleBtn.textContent = "Parar";
    toggleBtn.classList.add("running");
  }
  function stop() {
    running = false;
    clearTimeout(timerId);
    queue.length = 0;
    keyEl.disabled = false;
    noteEl.hidden = true;
    pickEl.removeAttribute("hidden");
    phaseEl.textContent = "Elige tonalidad y pulsa Empezar";
    drawTrack(-1);
    toggleBtn.textContent = "Empezar";
    toggleBtn.classList.remove("running");
  }
  toggleBtn.addEventListener("click", () => running ? stop() : start());

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" && e.target.type === "number") return;
    if (e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); running ? stop() : start(); }
    if (e.key === "ArrowUp") { e.preventDefault(); setBpm(Number(inputs.bpm.value) + (e.shiftKey ? 5 : 1)); }
    if (e.key === "ArrowDown") { e.preventDefault(); setBpm(Number(inputs.bpm.value) - (e.shiftKey ? 5 : 1)); }
  });

  drawTrack(-1);
})();
</script>
</body>
</html>
